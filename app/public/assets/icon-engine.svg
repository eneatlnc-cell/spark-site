<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Engine app icon">
  <!-- 依使用者提供之正確圖標重繪：淺藍→深藍垂直漸變 + 白色帆船 -->
  <defs>
    <linearGradient id="e-bg" x1="0" y1="0" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5DADE2"/>
      <stop offset="0.55" stop-color="#3D8FC7"/>
      <stop offset="1" stop-color="#2874A6"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="18" fill="url(#e-bg)"/>
  <g fill="#FFFFFF">
    <!-- 桅杆（微右傾） -->
    <path d="M50.6,16.8 L54.2,17.4 L55.1,64.8 L51.5,65.2 Z"/>
    <!-- 主帆（左，直邊三角） -->
    <path d="M52.4,17.6 L26,65 L52.4,64 Z"/>
    <!-- 前帆（右，飽滿外凸弧線，較大） -->
    <path d="M52.4,17.6 C66,27 75,43 76.7,57.2 C69,60.8 60.6,63 52.4,64 Z"/>
    <!-- 船體：斜甲板（右揚）+ 平滑弧底 -->
    <path d="M25,68 L84.5,60.5
             C87.3,61.2 88.2,63.6 87,66
             C81.5,75.5 68.5,78.6 54,78.6
             C39.5,78.6 27.2,74.5 24.9,69.8
             C24.6,68.8 24.7,68.3 25,68 Z"/>
    <!-- 水花三點（右下） -->
    <circle cx="88.6" cy="76.8" r="2.5"/>
    <circle cx="91.6" cy="82" r="1.7"/>
    <circle cx="89.4" cy="85.6" r="1.1"/>
  </g>
  <!-- 長 S 波浪線 -->
  <path d="M9,85 C21,80.8 31,80.8 39.5,82.5
           C48,84.2 52,87.5 60.5,87
           C69,86.5 77.5,81.8 84.5,80.5"
        fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
</svg>
